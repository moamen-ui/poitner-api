<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1400px;height:560px;overflow:hidden}
  .stage{width:1400px;height:560px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;grid-template-columns:1.05fr 1fr;background:#ffffff;position:relative}
  .left{padding:70px 64px;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:56px;height:56px;object-fit:contain}
  .brand .n{font-size:34px;font-weight:800;color:#0f172a;letter-spacing:-.02em}
  h1{font-size:52px;line-height:1.08;color:#0f172a;letter-spacing:-.02em;font-weight:800}
  h1 .g{background:linear-gradient(135deg,#16a34a,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:20px;color:#475569;line-height:1.5;max-width:560px}
  .chip{align-self:flex-start;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#16a34a,#2563eb);padding:8px 16px;border-radius:999px}
  .right{position:relative;background:radial-gradient(900px 500px at 60% 40%,color-mix(in srgb,#2563eb 12%,transparent),transparent);display:flex;align-items:center;justify-content:center}
  .win{width:560px;height:360px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 30px 70px rgba(2,6,23,.16);padding:20px;position:relative;overflow:hidden}
  .bar{display:flex;gap:7px;margin-bottom:22px}
  .bar span{width:12px;height:12px;border-radius:50%;background:#e2e8f0}
  .btn{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#16a34a,#2563eb);border:none;border-radius:10px;padding:12px 18px;font-size:16px}
  .line{height:12px;border-radius:6px;background:#f1f5f9;margin-top:16px}
  .line.s{width:55%}
  .pin{position:absolute;left:150px;top:66px;width:24px;height:24px;border-radius:50% 50% 50% 3px;background:linear-gradient(135deg,#16a34a,#2563eb);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
  .pop{position:absolute;left:186px;top:56px;background:#0f172a;color:#fff;font-size:14px;padding:9px 13px;border-radius:10px;white-space:nowrap}
  .tb{position:absolute;right:16px;top:16px;display:flex;gap:6px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:6px 8px;box-shadow:0 6px 18px rgba(2,6,23,.1)}
  .tb b{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#16a34a,#2563eb);padding:4px 8px;border-radius:6px}
  .tb i{font-size:12px;font-style:normal;color:#475569;padding:4px 8px}
</style></head><body>
