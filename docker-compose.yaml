services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pointer
      POSTGRES_PASSWORD: pointer
      POSTGRES_DB: pointer
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: { context: ., target: dev }
    env_file: .env
    environment:
      # Local/e2e only. The shipped default is 5 signups per hour per IP, which the end-to-end
      # suite legitimately blows through — it registers and accepts dozens of invitations from one
      # address in minutes. Raised here rather than in the code so production keeps the real limit.
      Security__RateLimits__SignupPerHour: "1000"
      Pointer__SkillVersion: "${POINTER_SKILL_VERSION:-}"
    ports: ["8090:8080"]
    depends_on: [db, mailpit]
    volumes: ["./:/src"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
  verdaccio:
    image: verdaccio/verdaccio:6
    ports: ["4873:4873"]
    volumes:
      - "./e2e/verdaccio/config.yaml:/verdaccio/conf/config.yaml"
      - "verdaccio-storage:/verdaccio/storage"
    profiles:
      - e2e-nightly
volumes:
  pgdata: {}
  verdaccio-storage: {}

