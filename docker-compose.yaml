services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pointer
      POSTGRES_PASSWORD: pointer
      POSTGRES_DB: pointer
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: { context: ., target: dev }
    env_file: .env
    environment:
      # Local/e2e only. The shipped default is 5 signups per hour per IP, which the end-to-end
      # suite legitimately blows through — it registers and accepts dozens of invitations from one
      # address in minutes. Raised here rather than in the code so production keeps the real limit.
      Security__RateLimits__SignupPerHour: "1000"
      Pointer__SkillVersion: "${POINTER_SKILL_VERSION:-}"
      # The `dev` Docker target (see Dockerfile) never restores at image-build time — it's the bare
      # SDK image plus `dotnet watch`, which restores from the bind-mounted source on every container
      # start. Without this, that restore's package cache lived at the default ~/.nuget/packages,
      # which is part of the CONTAINER's (not the bind mount's) filesystem — every
      # `docker compose ... up -d --force-recreate api` (e2e/scripts/restart-api.mjs, used by the
      # `registry`/`upgrade` e2e phases to rotate config/env without a full stack reset) threw that
      # cache away and re-restored the whole solution from nuget.org from scratch. That restore is
      # network-bound and its duration is NOT bounded by anything in this repo — observed 1.9-2min
      # PER PROJECT here once, comfortably blowing past restart-api.mjs's fixed 120s readiness
      # timeout (R1-06-04 key-rotation, local e2e gate, 2026-09-23). Pinning the global packages
      # folder onto the `nuget-cache` volume below survives `--force-recreate` (only `down -v`
      # removes it), so every restart after the run's first container start reuses already-restored
      # packages instead of hitting the network again.
      NUGET_PACKAGES: /nuget-cache
    ports: ["8090:8080"]
    depends_on: [db, mailpit]
    volumes:
      - "./:/src"
      - "nuget-cache:/nuget-cache"
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
  verdaccio:
    image: verdaccio/verdaccio:6
    ports: ["4873:4873"]
    volumes:
      - "./e2e/verdaccio/config.yaml:/verdaccio/conf/config.yaml"
      - "verdaccio-storage:/verdaccio/storage"
    profiles:
      - e2e-nightly
volumes:
  pgdata: {}
  verdaccio-storage: {}
  nuget-cache: {}

