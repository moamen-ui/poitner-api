<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentation — Pointer</title>
  <meta name="description" content="Pointer documentation: installing the widget, API keys, project settings, and workspace invitations." />
  <link rel="icon" href="../assets/favicon.ico" />
  <style>
    :root {
      --pf-green: #16a34a;
      --pf-blue: #2563eb;
      --pf-text: #0f172a;
      --pf-muted: #475569;
      --pf-bg: #ffffff;
      --pf-card: #ffffff;
      --pf-soft: #f1f5f9;
      --pf-border: #e2e8f0;
      --pf-grad: linear-gradient(135deg, var(--pf-green), var(--pf-blue));
      --pf-radius: 12px;
      --pf-max: 840px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --pf-text: #e5e7eb;
        --pf-muted: #94a3b8;
        --pf-bg: #0b1220;
        --pf-card: #111827;
        --pf-soft: #0f172a;
        --pf-border: #1f2937;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--pf-bg);
      color: var(--pf-text);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: var(--pf-max); margin: 0 auto; padding: 0 20px; }
    .nav { border-bottom: 1px solid var(--pf-border); background: var(--pf-card); }
    .nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: inherit; text-decoration: none; }
    .brand img { width: 28px; height: 28px; }
    .nav-links { display: flex; gap: 18px; flex-wrap: wrap; }
    .nav-links a { color: var(--pf-muted); text-decoration: none; font-size: 14px; }
    .nav-links a:hover, .nav-links a.active { color: var(--pf-text); }
    .content { padding: 48px 0 80px; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px;
      font-weight: 600; background: var(--pf-soft); color: var(--pf-muted); margin-bottom: 14px;
    }
    h1 { font-size: 34px; line-height: 1.2; margin: 0 0 12px; }
    .lead { color: var(--pf-muted); font-size: 18px; margin: 0 0 36px; }
    h2 {
      font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--pf-muted);
      margin: 34px 0 14px; font-weight: 700;
    }
    .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card {
      display: block; padding: 18px 20px; border: 1px solid var(--pf-border);
      border-radius: var(--pf-radius); background: var(--pf-card); text-decoration: none; color: inherit;
      transition: border-color .15s ease, transform .15s ease;
    }
    .card:hover { border-color: var(--pf-green); transform: translateY(-1px); }
    .card h3 { margin: 0 0 6px; font-size: 17px; }
    .card p { margin: 0; color: var(--pf-muted); font-size: 14px; }
    .note { color: var(--pf-muted); font-size: 14px; }
    footer { border-top: 1px solid var(--pf-border); padding: 24px 0; color: var(--pf-muted); font-size: 14px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a href="../index.html" class="brand">
        <img src="../assets/dog-mascot.png" alt="Pointer logo" />
        <span>Pointer Docs</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="active">All docs</a>
        <a href="../index.html">Home</a>
      </div>
    </div>
  </nav>

  <main class="content">
    <div class="wrap">
      <div class="badge">Documentation</div>
      <h1>Pointer documentation</h1>
      <p class="lead">
        Everything needed to install Pointer into an application, connect it to your AI coding
        agent, and run it for a team.
      </p>

      <!-- Rendered from pages.json rather than hard-coded. Every feature that ships a docs page
           also adds its entry there (see docs/roadmap/execution/IMPLEMENTER-BRIEF.md §5), so
           driving the index off the same file is what keeps this list from going stale the first
           time someone adds a page and forgets to edit two places. -->
      <div id="docs-index">
        <p class="note">Loading&hellip;</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">Pointer &mdash; click-to-comment feedback for teams building with AI.</div>
  </footer>

  <script>
    (async function () {
      const mount = document.getElementById('docs-index');
      try {
        const res = await fetch('pages.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const { pages } = await res.json();
        if (!Array.isArray(pages) || pages.length === 0) throw new Error('no pages listed');

        // Group by the `nav` field, preserving the order sections first appear in the file so the
        // getting-started material stays at the top without needing a separate ordering key.
        const groups = new Map();
        for (const page of pages) {
          const section = page.nav || 'Guides';
          if (!groups.has(section)) groups.set(section, []);
          groups.get(section).push(page);
        }

        mount.textContent = '';
        for (const [section, items] of groups) {
          const h2 = document.createElement('h2');
          h2.textContent = section;
          mount.appendChild(h2);

          const grid = document.createElement('div');
          grid.className = 'cards';
          for (const page of items) {
            const a = document.createElement('a');
            a.className = 'card';
            a.href = page.file;
            const h3 = document.createElement('h3');
            h3.textContent = page.title;
            const p = document.createElement('p');
            p.textContent = page.summary || '';
            a.append(h3, p);
            grid.appendChild(a);
          }
          mount.appendChild(grid);
        }
      } catch (err) {
        // Never leave the reader staring at "Loading…" — say what broke and still give them a way
        // in. The four pages below are the ones that exist today.
        mount.innerHTML =
          '<p class="note">The documentation index could not be loaded (' + String(err.message) + ').</p>' +
          '<div class="cards">' +
          '<a class="card" href="install.html"><h3>Install</h3><p>Add Pointer to your app.</p></a>' +
          '<a class="card" href="api-keys.html"><h3>API Keys</h3><p>Find, rotate and secure your key.</p></a>' +
          '<a class="card" href="project-settings.html"><h3>Project Settings</h3><p>Allowed origins and environment URLs.</p></a>' +
          '<a class="card" href="workspaces.html"><h3>Workspaces</h3><p>Invitations and workspace setup.</p></a>' +
          '</div>';
      }
    })();
  </script>
</body>
</html>
