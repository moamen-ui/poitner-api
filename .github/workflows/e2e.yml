name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'API/**'
      - 'Application/**'
      - 'Domain/**'
      - 'Infrastructure/**'
      - 'web-component/**'
      - 'cli/**'
      - 'e2e/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# One run per branch: a newer push cancels the older in-progress run (the full suite takes ~15 min and
# every push to main used to start another parallel run).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build
      - run: dotnet test --configuration Release --logger "trx"

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'   # html-validate uses fs.globSync (Node ≥ 22)
          cache: 'npm'
      - name: Configure Git identity
        run: |
          git config --global user.email "e2e@pointer.local"
          git config --global user.name "e2e"
      - name: Path filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cli:
              - 'cli/**'
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Build CLI
        run: cd cli && npm ci --no-audit --no-fund && npm run build
      - name: Install e2e dependencies and the Playwright browser
        # The api/widget/cli phases run `npx playwright test`; without `npm ci` in e2e/ the run died
        # with ERR_MODULE_NOT_FOUND '@playwright/test' right after the seed phase.
        run: |
          cd e2e && npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Create dev .env for the compose stack
        # docker-compose.yaml declares `env_file: .env` (gitignored). Without it every e2e run died in
        # the reset phase with "env file … .env not found" — the suite had never been green on main.
        # .env.example carries the local-only DBApplyContractMigrations=true so a fresh CI database
        # may apply contract migrations (DB-09).
        run: |
          test -f .env || cp .env.example .env
          # Route outbound mail to the compose stack's Mailpit so `emailSent` is real and the mail
          # phase can assert on delivered messages (the API reaches the service by its compose name).
          cat >> .env <<'EOF'
          Email__Provider=smtp
          Email__Smtp__Host=mailpit
          Email__Smtp__Port=1025
          Email__FromEmail=dev@pointer.local
          Email__FromName=Pointer (e2e)
          COMPOSE_PROFILES=e2e-nightly
          EOF
      - name: Wait for Verdaccio registry
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4873/-/ping > /dev/null 2>&1; then
              echo "Verdaccio ready on :4873"
              break
            fi
            sleep 1
          done
      - name: Run E2E PR
        if: github.event_name == 'pull_request'
        env:
          run_cli: ${{ steps.filter.outputs.cli }}
        run: |
          cd e2e
          unset NODE_AUTH_TOKEN GITHUB_TOKEN || true
          bash run-e2e.sh --pr --ci
      - name: Run E2E Nightly
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          cd e2e
          unset NODE_AUTH_TOKEN GITHUB_TOKEN || true
          bash run-e2e.sh --nightly --ci
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: e2e/state/report.md
      - name: Upload Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

  fresh-app:
    needs: e2e
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [vite, static, angular, next]
    steps:
      - uses: actions/checkout@v4
      - name: Path filters
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cli:
              - 'cli/**'
      - name: Skip condition check
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.cli }}" != "true" ] || [ "${{ matrix.stack }}" != "static" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
      - name: Setup Node
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Build CLI
        if: steps.check.outputs.skip != 'true'
        run: cd cli && npm ci && npm run build
      - name: Reset and Seed
        if: steps.check.outputs.skip != 'true'
        run: |
          cd e2e
          bash scripts/reset.sh
          node scripts/seed.mjs
      - name: Run fresh-app
        if: steps.check.outputs.skip != 'true'
        run: |
          cd e2e
          node fresh-app/run.mjs --stack ${{ matrix.stack }}
          npx playwright test fresh-app/fresh.spec.ts -g "${{ matrix.stack }}"
      - name: Upload Artifacts
        if: failure() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-${{ matrix.stack }}-failure
          path: |
            e2e/state/fresh/${{ matrix.stack }}
            e2e/playwright-report/

  whitelabel:
    needs: e2e
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Build CLI
        run: cd cli && npm ci && npm run build
      - name: Reset and Seed
        run: |
          cd e2e
          bash scripts/reset.sh
          node scripts/seed.mjs
      - name: Run Whitelabel & Rebrand Rehearsal
        env:
          E2E_MOCK_DOMAIN: pick-it.test
          E2E_MOCK_BRAND: PickIt
        run: |
          cd e2e
          bash run-e2e.sh --whitelabel --mock-domain --ci
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitelabel-report
          path: e2e/state/report.md

  manifest-determinism:
    needs: e2e
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - clone: a
            os: ubuntu-latest
            path: clone-a
          - clone: b
            os: macos-latest
            path: clone-b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ matrix.path }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build and Hash Manifest
        run: |
          cd ${{ matrix.path }}/e2e
          npm ci
          node -e "
            import('./scripts/lib/vite-fixture.mjs').then(async ({ buildFixture }) => {
              const { repo } = buildFixture({ enabled: true });
              const { readFileSync, writeFileSync } = await import('node:fs');
              const { createHash } = await import('node:crypto');
              const { join } = await import('node:path');
              const manifest = JSON.parse(readFileSync(join(repo.dir, '.pointer', 'manifest.json'), 'utf8'));
              const entries = manifest.entries ?? manifest;
              const sorted = JSON.stringify(entries, Object.keys(entries).sort());
              const hash = createHash('sha256').update(sorted).digest('hex');
              writeFileSync('entries-${{ matrix.clone }}.sha', hash + '\n');
            });
          "
      - name: Upload Manifest Hash Artifact
        uses: actions/upload-artifact@v4
        with:
          name: entries-${{ matrix.clone }}-sha
          path: ${{ matrix.path }}/e2e/entries-${{ matrix.clone }}.sha

  manifest-determinism-assert:
    needs: manifest-determinism
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: entries-a-sha
          path: artifacts/a
      - uses: actions/download-artifact@v4
        with:
          name: entries-b-sha
          path: artifacts/b
      - name: Assert Hashes Equal
        run: |
          SHA_A=$(cat artifacts/a/entries-a.sha)
          SHA_B=$(cat artifacts/b/entries-b.sha)
          echo "Clone A SHA: $SHA_A"
          echo "Clone B SHA: $SHA_B"
          [ \"$SHA_A\" = \"$SHA_B\" ]

