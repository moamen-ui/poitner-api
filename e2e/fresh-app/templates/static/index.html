<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Static App</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    h1 { color: #333; }
    form { margin-top: 1rem; }
    input, button { padding: 0.5rem; margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>Fresh Static App</h1>
  <p>This is an un-instrumented static HTML page for Pointer fresh-app tests.</p>
  <form id="sample-form" onsubmit="return false;">
    <input type="text" id="sample-input" placeholder="Your name" />
    <button type="button" id="sample-btn">Submit</button>
  </form>
</body>
</html>
