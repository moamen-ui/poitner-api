# RECOMMENDED answers (2026-09-26) — proposals for the owner to confirm or change, NOT yet approved.
# Brand PinSay / pinsay.dev was chosen by the owner 2026-09-26; everything else below is a recommendation.
# Angular/Vue were retired 2026-09-15 (tag last-three-apps, branch legacy/angular-vue) — out of scope;
# their HOST_APP_*/PKG_* fields are removed. SPLIT_STRATEGY=D keeps widget +
# extension inside the API repo, so REPO_WIDGET/REPO_EXTENSION intentionally equal REPO_API.
#
# Rebranding answers — fill this in with the human, then paste it into the executing agent's
# context alongside REBRANDING-PLAN.md. Every phase of the plan reads these values.
#
# Nothing in the plan may be executed while any REQUIRED field is empty.
# Convert to shell (rebrand.env, sourced by every phase) with:
#   sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' -e 's/: *"/="/' answers.yml > rebrand.env
#   set -a; . ./rebrand.env; set +a
# Then sanity-check the required ones are non-empty:
#   for v in NAME_DISPLAY NAME_PASCAL NAME_LOWER NAME_KEBAB NAME_UPPER NAME_SNAKE DOMAIN \
#            REPO_API REPO_DASHBOARD REPO_EXTENSION REPO_WIDGET NPM_SCOPE \
#            PKG_REACT LIVE_INSTALLS; do
#     [ -n "${!v}" ] || echo "MISSING: $v"; done

# ---------------------------------------------------------------- brand ------
NAME_DISPLAY: "PinSay"   # REQUIRED  Q1   marketing spelling, e.g. "Pointkit"
NAME_PASCAL: "PinSay"   # REQUIRED  Q1   C# namespaces/assemblies. [A-Za-z][A-Za-z0-9]* — no dots, no dashes
NAME_LOWER: "pinsay"   # REQUIRED  Q2   npm package, css prefix, folders, db, asset filenames
NAME_KEBAB: "pinsay"   # REQUIRED  Q2   repos, custom-element prefix, skill names (MUST allow a hyphen after it)
NAME_UPPER: "PINSAY"   # REQUIRED  Q2   env vars + JS globals. [A-Z_][A-Z0-9_]*
NAME_SNAKE: "pinsay"   # REQUIRED  Q2   browser storage keys
NAME_ARABIC: ""   # Q4b  transliteration for ar.json, or "" to keep the Latin-script name inline
LEGAL_NAME: "PinSay"   # Q3   LICENSE, store listing, email footer
TAGLINE: "Pin any element on your live app, say what you want — your AI coding tool ships it."   # Q4   <=132 chars (Chrome Web Store hard limit)

# --------------------------------------------------------------- domain ------
DOMAIN: "pinsay.dev"   # REQUIRED  Q5   apex, e.g. pointkit.dev
HOST_API: "api.pinsay.dev"   # api.$DOMAIN
HOST_APP: "app.pinsay.dev"   # app.$DOMAIN
HOST_DEMO: "demo.pinsay.dev"   # demo.$DOMAIN
HOST_DOCS: "docs.pinsay.dev"   # owner 2026-09-26 — subdomain created
HOST_LANDING: "pinsay.dev"   # $DOMAIN
EMAIL_FROM: "noreply@pinsay.dev"   # Q8   noreply@$DOMAIN — must be a VERIFIED Brevo sender before cutover
EMAIL_FROM_NAME: "PinSay"   # Q8
EMAIL_SUPPORT: "support@pinsay.dev"   # Q9
BREVO_VERIFIED: "yes"   # Q10 — owner confirmed 2026-09-26: the pinsay.dev sender e-mails are created on Brevo

# ---------------------------------------------------------------- repos ------
REPO_API: "git@github.com:moamen-ui/pinsay-api.git"   # REQUIRED Q11 — PRIVATE
REPO_DASHBOARD: "git@github.com:moamen-ui/pinsay-dashboard.git"   # REQUIRED Q11 — PRIVATE
REPO_EXTENSION: "git@github.com:moamen-ui/pinsay-api.git"   # REQUIRED Q11 — no own repo listed: extension/ stays in the private API repo
REPO_WIDGET: "git@github.com:moamen-ui/pinsay-widget.git"   # REQUIRED Q11 — PUBLIC (web-component/ only)
HISTORY_MODE: "mirror"   # Q12 mirror for api + dashboard; widget + landing extracted with git filter-repo --path (only that folder's history)
SPLIT_STRATEGY: "B"   # Q13 widget repo builds; built widget.{js,css} committed into pinsay-api/API/wwwroot (plan §8.5: B for cutover, A = npm package later)
OLD_REPOS: "archive"   # Q14  archive | delete
REPO_LANDING: "git@github.com:moamen-ui/pinsay-landing.git"   # PRIVATE — added field (template has no repo slot for the landing)
LANDING_HOME: "own-repo"   # landing/ moves to pinsay-landing — the VM then clones it instead of serving ~/pointer-api/landing

# Repo visibility (owner, 2026-09-26): pinsay-widget PUBLIC; pinsay-api, pinsay-dashboard, pinsay-landing PRIVATE.
# Before making pinsay-widget public: secret-scan its extracted history (gitleaks / trufflehog) and confirm
# web-component/ carries no internal URLs, keys or customer data.
REPO_VISIBILITY: "widget=public api=private dashboard=private landing=private"

# ------------------------------------------------------------- packages ------
NPM_SCOPE: "@moamen-ui"   # REQUIRED  Q15  e.g. @moamen-ui
PKG_REACT: "@moamen-ui/pinsay"   # Q16 — owner 2026-09-26; GitHub Packages requires the @moamen-ui scope
PKG_WIDGET: ""   # only if SPLIT_STRATEGY=A
PKG_START_VER: "1.0.0"   # Q17  e.g. 1.0.0 — MUST be passed explicitly on the first publish (§8.6)
DEPRECATE_OLD: "deprecate"   # Q18  deprecate  (never "unpublish")
REGISTRY: "https://npm.pkg.github.com"   # Q19  https://npm.pkg.github.com

# --------------------------------------------------------------- policy ------
LIVE_INSTALLS: "no"   # REQUIRED  Q20  yes | no  — "yes" makes §9 mandatory
COMPAT_UNTIL: "n/a"   # Q21  ISO date | n/a
RENAME_DB: "no"   # Q22  yes | no
VOLUME_STRATEGY: "A"   # §10.3  A(pin project name) | B(migrate volumes) | C(dump/restore)
RENAME_PROJECT_KEYS: "no"   # Q23  yes | no
REWRITE_SCREENSHOT_URLS: "no"   # §11.4  yes | no (no = keep the old api host proxying)
EXT_PUBLISHED: "no"   # Q24  yes | no
FIX_POITNER_TYPO: "yes"   # Q25  yes | no
HISTORICAL_DOCS: "allowlist"   # §5.10  rewrite | allowlist
