# Production stack: Postgres + API + Caddy (TLS termination + reverse proxy + static dashboard).
# Usage:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# See DEPLOY.md for the full host setup, DNS, and dashboard build steps.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pointer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pointer
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build:
      context: .
      target: final
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    restart: unless-stopped
    depends_on: [db]
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=pointer;Username=pointer;Password=${DB_PASSWORD}"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      DBMigrationEnabled: "true"
      # DB-09: set to true only by scripts/deploy-api.sh on its POINTER_APPLY_CONTRACT=1 path. Never put DB_APPLY_CONTRACT in .env.prod.
      DBApplyContractMigrations: "${DB_APPLY_CONTRACT:-false}"
      # C1: strict tenant isolation — a null-tenant non-super principal sees NO strict-own rows.
      # Safe to enable now that legacy null-owner data has been back-filled to real owners
      # (see docs/reviews/fable-c1-backfill-runbook.md).
      Tenancy__StrictNullTenantIsolation: "true"
      # H1/H2: enforce the SecurityStamp check per request (revokes tokens on disable/reject/password
      # change). Enabling this logs out all currently-issued tokens once (they predate the stamp claim).
      Auth__ValidateSecurityStamp: "true"
      # DB-08: daily row retention (usage_events / read notifications / orphaned page context
      # snapshots / dead invites). RETENTION_ENABLED=false pauses the whole job; each period is
      # independently overridable and 0 disables retention for that table only.
      Retention__Enabled: "${RETENTION_ENABLED:-true}"
      Retention__UsageEventsDays: "${RETENTION_USAGE_EVENTS_DAYS:-180}"
      Retention__NotificationsReadDays: "${RETENTION_NOTIFICATIONS_READ_DAYS:-90}"
      Retention__PageContextSnapshotDays: "${RETENTION_SNAPSHOT_DAYS:-30}"
      Retention__InvitesDays: "${RETENTION_INVITES_DAYS:-90}"
      JWT__SigningKey: "${JWT_SIGNING_KEY}"
      JWT__Issuer: "pointer-api"
      JWT__LifetimeHours: "12"
      # R5-62 (review fix): two-key rotation window (kid header). JWT_SIGNING_KEY is ALSO the root
      # secret for API-key encryption, password-reset tokens, signed upload URLs and audit IP hashing
      # (ApiKeyProtector/ResetTokenService/UploadSigner/AuditWriter all read JWT:SigningKey directly)
      # — it must NEVER be repointed. Slot 0's secret defaults to JWT_SIGNING_KEY but can now be
      # rotated independently via JWT_KEY_0_ID/JWT_KEY_0_SECRET, without ever touching
      # JWT_SIGNING_KEY. k1 is the new key being rotated in; unset (empty) by default, which
      # ResolveAllKeys skips so it never trips the >= 32-byte startup check. See DEPLOY.md § JWT key
      # rotation for the runbook.
      JWT__ActiveKeyId: "${JWT_ACTIVE_KEY_ID:-k0}"
      JWT__Keys__0__Id: "${JWT_KEY_0_ID:-k0}"
      JWT__Keys__0__Secret: "${JWT_KEY_0_SECRET:-${JWT_SIGNING_KEY}}"
      JWT__Keys__1__Id: "${JWT_KEY_1_ID:-}"
      JWT__Keys__1__Secret: "${JWT_KEY_1_SECRET:-}"
      ADMIN__EMAIL: "${ADMIN_EMAIL}"
      ADMIN__PASSWORD: "${ADMIN_PASSWORD}"
      # Self-configuring embed/skills point at the public API origin.
      Pointer__Enabled: "true"
      Pointer__Server: "${POINTER_SERVER}"
      Pointer__Project: "pointer-api"
      Pointer__Environment: "production"
      Cli__MinVersion: "${CLI_MIN_VERSION:-0.1.0}"
      # Transactional email (Brevo). Enabled only when a key + verified from-address are set.
      Email__Enabled: "${EMAIL_ENABLED:-false}"
      Email__ApiKey: "${EMAIL_API_KEY:-}"
      Email__FromEmail: "${EMAIL_FROM_EMAIL:-}"
      Email__FromName: "${EMAIL_FROM_NAME:-Pointer}"
      # R5-58 observability baseline. Both empty by default — Sentry stays uninitialized and the
      # uptime dead-man's-switch does nothing until an operator sets them.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      UPTIME_PING_URL: "${UPTIME_PING_URL:-}"
    volumes: ["uploads:/app/wwwroot/uploads"]
    # Not published to the host — Caddy is the only public entrypoint.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built dashboard: dashboard/react (built from pointer-dashboard/react → dist →
      # copied here). Served at app.pointer / demo.pointer. React is the only dashboard
      # since 2026-09-15 — see Caddyfile for the legacy app-<fw> redirect hosts.
      - ./dashboard:/srv/dashboard:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
