# Production stack: Postgres + API + Caddy (TLS termination + reverse proxy + static dashboard).
# Usage:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# See DEPLOY.md for the full host setup, DNS, and dashboard build steps.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pointer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pointer
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build:
      context: .
      target: final
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    restart: unless-stopped
    depends_on: [db]
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=pointer;Username=pointer;Password=${DB_PASSWORD}"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      DBMigrationEnabled: "true"
      # C1: strict tenant isolation — a null-tenant non-super principal sees NO strict-own rows.
      # Safe to enable now that legacy null-owner data has been back-filled to real owners
      # (see docs/reviews/fable-c1-backfill-runbook.md).
      Tenancy__StrictNullTenantIsolation: "true"
      # H1/H2: enforce the SecurityStamp check per request (revokes tokens on disable/reject/password
      # change). Enabling this logs out all currently-issued tokens once (they predate the stamp claim).
      Auth__ValidateSecurityStamp: "true"
      JWT__SigningKey: "${JWT_SIGNING_KEY}"
      JWT__Issuer: "pointer-api"
      JWT__LifetimeHours: "12"
      ADMIN__EMAIL: "${ADMIN_EMAIL}"
      ADMIN__PASSWORD: "${ADMIN_PASSWORD}"
      # Self-configuring embed/skills point at the public API origin.
      Pointer__Enabled: "true"
      Pointer__Server: "${POINTER_SERVER}"
      Pointer__Project: "pointer-api"
      Pointer__Environment: "production"
      Cli__MinVersion: "${CLI_MIN_VERSION:-0.1.0}"
      # Transactional email (Brevo). Enabled only when a key + verified from-address are set.
      Email__Enabled: "${EMAIL_ENABLED:-false}"
      Email__ApiKey: "${EMAIL_API_KEY:-}"
      Email__FromEmail: "${EMAIL_FROM_EMAIL:-}"
      Email__FromName: "${EMAIL_FROM_NAME:-Pointer}"
    volumes: ["uploads:/app/wwwroot/uploads"]
    # Not published to the host — Caddy is the only public entrypoint.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built dashboard: dashboard/react (built from pointer-dashboard/react → dist →
      # copied here). Served at app.pointer / demo.pointer. React is the only dashboard
      # since 2026-09-15 — see Caddyfile for the legacy app-<fw> redirect hosts.
      - ./dashboard:/srv/dashboard:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
